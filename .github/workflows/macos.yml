name: macOS

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "CrossPlatform/**"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "Tests/**"
      - "Fixtures/**"
      - "Scripts/**"
      - "docs/FEATURE_PARITY.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "CrossPlatform/**"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "Tests/**"
      - "Fixtures/**"
      - "Scripts/**"
      - "docs/FEATURE_PARITY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: macOS 15 / Apple Silicon contract
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up the shared macOS toolchain and dependency cache
        uses: ./.github/actions/setup-macos

      - name: Build once and run macOS behavior contracts
        run: bash Scripts/test-macos.sh

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in Scripts/*.sh Scripts/lib/*.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s Tests/ReleaseWorkflowTests -v
          swiftc -typecheck Scripts/verify-sparkle-signature.swift
          git diff --exit-code

      - name: Exclude app and test products before caching dependencies
        run: python3 Scripts/prune-macos-build-cache.py
